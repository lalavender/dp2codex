<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JinDX Proxy Admin</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#111; color:#e0e0e0; }
.container { max-width:1000px; margin:0 auto; padding:20px; }
h1 { font-size:24px; margin-bottom:20px; color:#4fc3f7; }
.tabs { display:flex; gap:2px; margin-bottom:20px; }
.tab { padding:10px 24px; background:#222; cursor:pointer; border:none; color:#999; font-size:14px; }
.tab.active { background:#333; color:#4fc3f7; }
.tab:hover { background:#2a2a2a; }
.panel { display:none; background:#1a1a1a; padding:20px; border-radius:4px; }
.panel.active { display:block; }
.form-group { margin-bottom:15px; }
label { display:block; margin-bottom:4px; color:#aaa; font-size:13px; }
input,select { width:100%; padding:8px 12px; background:#222; border:1px solid #333; color:#e0e0e0; border-radius:4px; font-size:14px; }
input:focus { border-color:#4fc3f7; outline:none; }
button { padding:8px 20px; background:#4fc3f7; color:#111; border:none; border-radius:4px; cursor:pointer; font-size:14px; font-weight:600; }
button:hover { background:#39b0e4; }
button:disabled { opacity:.5; cursor:not-allowed; }
.status { margin-top:10px; padding:8px; border-radius:4px; display:none; }
.status.ok { display:block; background:#1b4332; color:#6fcf97; }
.status.err { display:block; background:#3d0f0f; color:#e74c3c; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-bottom:20px; }
.stat-card { background:#222; padding:15px; border-radius:4px; }
.stat-value { font-size:24px; font-weight:700; color:#4fc3f7; }
.stat-label { font-size:12px; color:#888; margin-top:4px; }
.copy-btn { background:#333; color:#e0e0e0; padding:4px 10px; font-size:12px; cursor:pointer; border:1px solid #444; border-radius:3px; }
.copy-btn:hover { background:#444; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { padding:8px 12px; text-align:left; border-bottom:1px solid #222; font-size:13px; }
th { color:#888; font-weight:600; }
.log-line { font-family:monospace; font-size:12px; padding:2px 0; color:#aaa; border-bottom:1px solid #222; }
</style>
</head>
<body>
<div class="container">
<h1>JinDX Proxy</h1>
<div class="tabs">
<button class="tab active" onclick="switchTab('codex')">Codex 设置</button>
<button class="tab" onclick="switchTab('stats')">统计</button>
<button class="tab" onclick="switchTab('logs')">日志</button>
</div>

<!-- Codex Settings -->
<div id="tab-codex" class="panel active">
<div class="form-group">
<label>DeepSeek API Key</label>
<input id="deepseek_key" type="password" placeholder="sk-...">
</div>
<div class="form-group">
<label>DeepSeek Base URL</label>
<input id="deepseek_base" placeholder="https://api.deepseek.com">
</div>
<div class="form-group">
<label>默认模型</label>
<input id="default_model" placeholder="deepseek-v4-pro">
</div>
<div class="form-group">
<label>推理力度 (Reasoning Effort)</label>
<select id="reasoning_effort"><option>low</option><option>medium</option><option selected>high</option></select>
</div>
<div class="form-group">
<label>启用推理缓存</label>
<select id="enable_reasoning_cache"><option value="true">是</option><option value="false">否</option></select>
</div>
<button onclick="saveConfig()">保存配置</button>
<div id="save-status" class="status"></div>
</div>

<div class="form-group">
<label>DeepSeek Base URL</label>
</div>
<div class="form-group">
<label>默认模型</label>
</div>
<div class="form-group">
<label>精简 thinking 输出</label>
</div>
<div class="form-group">
<label>启用 DeepSeek thinking</label>
</div>
<button onclick="saveConfig()">保存配置</button>
</div>

<!-- Stats -->
<div id="tab-stats" class="panel">
<div class="stats-grid" id="stats-grid"></div>
<h3 style="color:#888;font-size:14px;margin-top:20px;">环境变量 (一键复制)</h3>
<pre id="env-vars" style="background:#222;padding:15px;border-radius:4px;font-size:12px;margin:10px 0;"></pre>
<button class="copy-btn" onclick="copyEnv()">复制环境变量</button>
</div>

<!-- Logs -->
<div id="tab-logs" class="panel">
<div id="log-entries"></div>
<button onclick="loadLogs()" style="margin-top:10px;">刷新日志</button>
</div>
</div>

<script>
let config = {};

function switchTab(name) {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
document.querySelector(`.tab[onclick*="${name}"]`).classList.add('active');
document.getElementById(`tab-${name}`).classList.add('active');
if (name === 'stats') { loadStats(); }
if (name === 'logs') { loadLogs(); }
}

function loadConfig() {
fetch('/config').then(r=>r.json()).then(cfg => {
config = cfg;
for (const [k,v] of Object.entries(cfg)) {
const el = document.getElementById(k);
if (el) {
if (el.tagName === 'SELECT') el.value = String(v);
else el.value = String(v);
}
}
buildEnvVars(cfg);
});
}

function saveConfig() {
const updates = {};
document.querySelectorAll('.panel.active input, .panel.active select').forEach(el => {
const id = el.id;
if (id && config[id] !== undefined) {
let val = el.value;
if (val === 'true') val = true;
else if (val === 'false') val = false;
updates[id] = val;
}
});
fetch('/config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updates)})
.then(r=>r.json()).then(res => {
const el = document.getElementById('save-status') || document.querySelector('.status');
el.className = 'status ok';
el.textContent = '配置已保存';
el.style.display = 'block';
setTimeout(() => el.style.display = 'none', 2000);
loadConfig();
});
}

function loadStats() {
fetch('/stats').then(r=>r.json()).then(s => {
const grid = document.getElementById('stats-grid');
grid.innerHTML = '';
const items = [
['total_requests','请求总数'],
['active_streams','活跃流'],
['cache_hit_rate','缓存命中率'],
['error_rate','错误率'],
['uptime_seconds','运行时间'],
['cache_hits','缓存命中'],
['cache_misses','缓存未命中'],
];
for (const [k,label] of items) {
let v = s[k];
if (k === 'uptime_seconds') v = formatUptime(v);
else if (typeof v === 'number') v = v.toFixed(1);
grid.innerHTML += `<div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">${label}</div></div>`;
}
});
}

function loadLogs() {
fetch('/logs?limit=100').then(r=>r.json()).then(data => {
const el = document.getElementById('log-entries');
el.innerHTML = (data.logs||[]).slice().reverse().map(l =>
`<div class="log-line">${new Date(l.time).toLocaleTimeString()} ${l.message}</div>`
).join('');
});
}

function buildEnvVars(cfg) {
const vars = [
`DEEPSEEK_API_KEY=${cfg.deepseek_key || ''}`,
`DEEPSEEK_BASE=${cfg.deepseek_base || 'https://api.deepseek.com'}`,
`DEFAULT_MODEL=${cfg.default_model || 'deepseek-v4-pro'}`,
];
document.getElementById('env-vars').textContent = vars.join('\n');
}

function copyEnv() {
navigator.clipboard.writeText(document.getElementById('env-vars').textContent);
alert('已复制');
}

function formatUptime(s) {
const h = Math.floor(s / 3600);
const m = Math.floor((s % 3600) / 60);
return `${h}h ${m}m`;
}

loadConfig();
setInterval(loadStats, 3000);
</script>
</body>
</html>
